<!doctype html><meta charset="utf-8"><title>b</title><style>html,body{margin:0;background:#fff}</style><body>
<script>
var f=document.createElement('iframe'); f.style.cssText='width:390px;height:1200px;border:0;display:block';
f.src='/riktning-b-dagen/index.html'; document.body.appendChild(f);
f.addEventListener('load',function(){setTimeout(function(){
  var d=f.contentDocument,w=f.contentWindow;

  function rec(l,el){var r=el.getBoundingClientRect();out.push({l:l,x:+r.left.toFixed(2),y:+r.top.toFixed(2),w:+r.width.toFixed(2),h:+r.height.toFixed(2)});}
  rec('send_pil',d.querySelector('#fraga-panel .of-btn-send svg'));
  rec('send_btn',d.querySelector('#fraga-panel .of-btn-send'));
  var mli=d.querySelector('.of-material'); 
  document.title='T:'+JSON.stringify(out);
},1200);});
</script>
