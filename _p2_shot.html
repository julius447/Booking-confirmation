<!doctype html><meta charset="utf-8"><title>shot</title>
<style>html,body{margin:0;padding:0;background:#fff}</style><body>
<script>
var q=new URLSearchParams(location.search); var W=q.get('w')||'390';
var f=document.createElement('iframe'); f.id='f';
f.style.cssText='width:'+W+'px;height:2500px;border:0;display:block';
f.src='/riktning-b-dagen/index.html'; document.body.appendChild(f);
f.addEventListener('load',function(){setTimeout(function(){
  var d=f.contentDocument;
  d.querySelectorAll('details').forEach(function(x){x.open=true;});
  d.querySelectorAll('.bk-panel').forEach(function(p){p.classList.add('visible');});
  var out=[];
  function rec(l,el){if(!el)return;var r=el.getBoundingClientRect();
    out.push({l:l,x:+r.left.toFixed(2),y:+r.top.toFixed(2),w:+r.width.toFixed(2),h:+r.height.toFixed(2)});}
  var fa=d.querySelectorAll('.bk-fact__ico'); rec('fact_klocka',fa[0]); rec('fact_karta',fa[1]);
  var dt=d.querySelectorAll('.b-step__dot'); rec('dot_blixt',dt[0]); rec('dot_dokument',dt[1]);
  var ck=d.querySelectorAll('.of-work .w-check'); ck.forEach(function(c,i){rec('bock_'+(i+1),c);});
  rec('lead_photo',d.querySelector('.b-lead .bk-who__photo'));
  rec('m_arrow',d.querySelector('.of-material summary .m-arrow'));
  rec('send_pil',d.querySelector('#fraga-panel .of-btn-send svg'));
  rec('mat_li1',d.querySelector('.of-material ul li'));
  document.title='T:'+JSON.stringify(out);
},1400);});
</script>
